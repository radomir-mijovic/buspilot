{% load static %}
<div class="row mt-4">
    <div class="col-lg-6">
        <div>
            <h5 class="text-center" data-key="t-vehicle-rides-title">Zakazane Vožnje</h5>
            <div class="timeline mb-2">
                {% for ride in agency.rides_to_come %}
                    <div class="timeline-item left">
                        <i class="icon ri-bus-fill"></i>
                        <div class="date fs-13">{{ ride.start_date }}</div>
                        <div class="content">
                            <div class="d-flex">
                                <a href={% url 'ride:ride_update' ride.pk %} class="flex-grow-1 ms-3">
                                    <h5 class="fs-14">
                                        {{ ride.title }}<small class="text-muted fs-13 fw-normal">- {{ ride.start_time }}</small>
                                    </h5>
                                    <p class="text-muted mb-2">{{ ride.get_ride_type_display }}</p>
                                </a>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
