<div class="col-xxl-3 col-sm-6 project-card">
    <div class="card">
        <a href="{% url 'agency:agency_details' agency.id %}">
            <div class="card-body">
                <div class="p-3 mt-n3 mx-n3 bg-{{ agency.card_header_color }}-subtle rounded-top">
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h5 class="mb-0 fs-14">{{ agency.name }}</h5>
                        </div>
                    </div>
                </div>
                <div class="py-3">
                    <div class="row gy-3">
                        <div class="col-6 text-center">
                            <p class="text-muted mb-1" data-key="t-scheduled-rides">Zakazanih vožnji</p>
                            <h5 class="fs-13">{{ agency.rides_to_come_count }}</h5>
                        </div>
                        <div class="col-6 text-center">
                            <p class="text-muted mb-1" data-key="t-completed-rides">Završenih vožnji</p>
                            <h5 class="fs-13">{{ agency.pass_rides_count }}</h5>
                        </div>
                    </div>
                </div>
            </div>
        </a>
    </div>
</div>
