<div class="modal fade zoomIn"
     id="removeFileItemModal"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body p-5 text-center">
                <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop" colors="primary:#405189,secondary:#f06548" style="width: 90px; height: 90px"></lord-icon>
                <div class="mt-4 text-center">
                    <h4 class="fs-semibold" data-key="t-are-you-sure">Da li ste sigurni?</h4>
                    <p class="text-muted fs-14 mb-4 pt-1" data-key="t-agency-delete-confirm">Agencija će biti trajno obrisana.</p>
                    <div class="hstack gap-2 justify-content-center">
                        <button class="btn btn-link link-success fw-medium text-decoration-none"
                                data-bs-dismiss="modal">
                            <i class="ri-close-line me-1 align-middle"></i>
                            <span data-key="t-close">Zatvori</span>
                        </button>
                        <form id="deleteAgencyConfirm"
                              method="POST"
                              action="">
                            {% csrf_token %}
                            <button class="btn btn-danger" type="submit" data-key="t-yes-delete">Da, Obriši!!</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
