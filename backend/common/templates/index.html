{% load django_vite static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="canonical" href="https://buspilot.me/" />
        <meta name="description"
              content="BusPilot omogućava jednostavno upravljanje autobuskim prevozom, redovima vožnje, vozačima, vozilima i putnicima." />
        <meta content="BusPilot" name="author" />
        <title>BusPilot | Redovi vožnje, vozila i vozači na jednom mjestu</title>
        <meta property="og:title"
              content="BusPilot - Softver za upravljanje autobuskim prevozom" />
        <meta property="og:description"
              content="Upravljanje linijama, vozačima, vozilima i rezervacijama na jednom mjestu." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://buspilot.me" />
        <meta property="og:image" content="https://buspilot.me/og-image.jpg" />
        <link rel="icon"
              type="image/svg+xml"
              href="{% static 'images/buspilot-favicon.svg' %}">
        <style>
        *,
        html,
        body {
            margin: 0;
            padding: 0;
        }
        </style>
        {% vite_hmr_client %}
        {% vite_react_refresh %}
    </head>
    <body>
        <div id="index"></div>
        {% vite_asset 'assets/pages/index.jsx' %}
    </body>
</html>
